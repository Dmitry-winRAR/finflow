name: FinFlow Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finflow
          POSTGRES_USER: finflow
          POSTGRES_PASSWORD: finflow_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finflow -d finflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        env:
          PGPASSWORD: finflow_password
        run: |
          psql -h localhost -U finflow -d finflow -f db/init.sql

      - name: Verify database schema
        env:
          PGPASSWORD: finflow_password
        run: |
          psql -h localhost -U finflow -d finflow -c "\dt"
          psql -h localhost -U finflow -d finflow -c "\d users"
          psql -h localhost -U finflow -d finflow -c "\d transactions"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://finflow:finflow_password@localhost:5432/finflow
        run: pytest -v